name: Daily Bookmanager Scrape

on:
  schedule:
    - cron: '0 10 * * *' # Runs at 10:00 UTC (Early morning Western Canada)
  workflow_dispatch: # Allows you to run it manually from GitHub
  
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # These are the missing pieces from your error log:
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libglpk-dev \
            libx11-dev \
            libxt-dev \
            pandoc \
            google-chrome-stable

      - name: Restore renv package cache
        uses: r-lib/actions/setup-renv@v2

      - name: Run Pipeline
        run: |
          Rscript -e 'targets::tar_make()'

      - name: Commit and Push results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/book_data_master.csv
          git commit -m "Daily data update: $(date)" || echo "No changes to commit"
          git push